services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${DB_NAME:-study_plan}
      MARIADB_USER: ${DB_USER:-app}
      MARIADB_PASSWORD: ${DB_PASSWORD:-app}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # Own volume, own data — this demo never talks to the university system.
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_USER: ${DB_USER:-app}
      PMA_PASSWORD: ${DB_PASSWORD:-app}
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"

  swagger-ui:
    image: swaggerapi/swagger-ui
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./openapi/openapi.yaml:/spec/openapi.yaml:ro
    ports:
      - "${SWAGGER_PORT:-8082}:8080"

  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
      DB_NAME: ${DB_NAME:-study_plan}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  mariadb_data:
